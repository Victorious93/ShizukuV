// Victorious Framework Work: pure-JVM core of the privileged bridge.
// No Android dependencies, so grants, path scoping, redaction, profiles and the
// startup state machine are unit-testable on any JDK.
plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

dependencies {
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    // org.json is part of the Android framework at runtime; only needed on the JVM for tests.
    compileOnly 'org.json:json:20240303'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation 'org.json:json:20240303'
}

tasks.withType(Test).configureEach {
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
