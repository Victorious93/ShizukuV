// ShizukuV signing.
//
// * debug   -> the committed, public, debug-only keystore (keystore/README.md). Needs no secrets, so debug APKs are
//              signed identically on every machine and in CI.
// * release -> signed ONLY when signing.properties (git-ignored) provides a real key; otherwise the release APK stays
//              UNSIGNED. There is no fallback to the debug key, and nothing here reads environment secrets.
ext.hasReleaseKey = rootProject.file('signing.properties').canRead()

android.signingConfigs.debug {
    storeFile rootProject.file('keystore/shizukuv-debug.keystore')
    storePassword 'android'
    keyAlias 'androiddebugkey'
    keyPassword 'android'
}

def ksFile = rootProject.file('signing.properties')
if (ksFile.canRead()) {
    def props = new Properties()
    ksFile.withInputStream { props.load(it) }
    android.signingConfigs.sign.storeFile file(props['KEYSTORE_FILE'])
    android.signingConfigs.sign.storePassword props['KEYSTORE_PASSWORD']
    android.signingConfigs.sign.keyAlias props['KEYSTORE_ALIAS']
    android.signingConfigs.sign.keyPassword props['KEYSTORE_ALIAS_PASSWORD']
}
