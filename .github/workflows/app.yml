name: App

on:
  push:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:

# Debug builds need no secrets. Nothing here reads signing material on pull requests or non-default branches.
permissions:
  contents: read

jobs:
  test:
    name: Unit tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # versionCode/versionName come from git history
          submodules: recursive   # none today (api/ is vendored); if one is added it is fetched over HTTPS, never SSH
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK, NDK and CMake (versions pinned in docs/TOOLCHAIN.md)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: "Unit tests (bridge-core - grants, scope, startup, profiles, identity and contract consistency)"
        run: ./gradlew :bridge-core:test --stacktrace
      - name: Android lint
        run: ./gradlew :manager:lintDebug :server:lintDebug :bridge-sdk:lintDebug --continue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            bridge-core/build/reports/tests
            */build/reports/lint-results-debug.html
          if-no-files-found: ignore

  build:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK, NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Debug APK (secret-free) and unsigned release APK
        run: ./gradlew :manager:assembleDebug :manager:assembleRelease --stacktrace
      - name: Verify packaging (identity, ABIs, native libs, no upstream identifiers)
        run: bash scripts/verify-apk.sh
      - name: Checksums and signing labels
        run: bash scripts/release-artifacts.sh
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shizukuv-debug-apk
          path: manager/build/outputs/apk/debug/shizukuv-*-debug.apk
          if-no-files-found: error
          compression-level: 0
      - name: Upload checksums and build info
        uses: actions/upload-artifact@v4
        with:
          name: shizukuv-build-info
          path: |
            out/artifacts/SHA256SUMS
            out/artifacts/BUILD-INFO.txt
            out/artifacts/*release-unsigned.apk
          if-no-files-found: warn

  # A production-signed release is built only on the default branch and only if the repository provides the key.
  # Without it the job still succeeds with the unsigned release and says so; it never falls back to the debug key.
  release-signed:
    name: Signed release (default branch, key required)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK, NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Write signing.properties (only if the secrets exist)
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::No release key configured; building the UNSIGNED release only."
          else
            printf '%s' "$KEYSTORE" | base64 --decode > key.jks
            { echo "KEYSTORE_FILE=../key.jks"; echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEYSTORE_ALIAS=$KEYSTORE_ALIAS"; echo "KEYSTORE_ALIAS_PASSWORD=$KEYSTORE_ALIAS_PASSWORD"; } > signing.properties
          fi
      - run: ./gradlew :manager:assembleRelease --stacktrace
      - run: bash scripts/release-artifacts.sh
      - name: Remove signing material
        if: always()
        run: rm -f key.jks signing.properties
      - uses: actions/upload-artifact@v4
        with:
          name: shizukuv-release
          path: out/artifacts/*
          compression-level: 0
