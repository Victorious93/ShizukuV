name: Bug report
description: Report a bug in ShizukuV (not in upstream Shizuku)

body:
  - type: checkboxes
    id: requirements
    attributes:
      label: Requirements
      options:
        - label: ShizukuV is installed from this repository (a release or a CI debug APK)
        - label: ShizukuV is not running in a virtual environment or broken ROM (GrapheneOS)
        - label: (Root users) No Xposed installed / Xposed is not enabled for ShizukuV

  - type: input
    id: version
    attributes:
      label: Latest ShizukuV version
    validations:
      required: true

  - type: input
    id: shizukuv_version
    attributes:
      label: Version in use
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - adb
        - root
        - manual
    validations:
      required: true

  - type: input
    id: android_version
    attributes:
      label: Android version
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
    validations:
      required: true

  - type: textarea
    id: reproducer
    attributes:
      label: What did you do

  - type: textarea
    id: logs
    attributes:
      label: What happened
      description: You can upload log and screenshot

  - type: textarea
    id: expected-behaviour
    attributes:
      label: What do you expect
